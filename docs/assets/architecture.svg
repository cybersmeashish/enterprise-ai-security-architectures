<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Enterprise AI Gateway security boundary</title><desc id="desc">Trusted identity and reviewed policy precede routing and separately approved synthetic tools. Providers and model text are untrusted.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6ed9cb"/></marker></defs>
<rect width="1200" height="580" rx="24" fill="#101e2a"/>
<g font-family="Arial,sans-serif" fill="#eaf3f8">
<text x="44" y="58" font-size="15" fill="#87acbd" letter-spacing="2">ENTERPRISE AI GATEWAY · SECURITY REFERENCE</text>
<text x="44" y="104" font-size="30" font-weight="700">The model proposes. Policy authorizes.</text>
<rect x="44" y="155" width="250" height="96" rx="12" fill="#183546" stroke="#5bb9ae"/>
<text x="66" y="194" font-size="20">Trusted principal</text><text x="66" y="224" font-size="15" fill="#b2ceda">Tenant · scope · approved purpose</text>
<rect x="365" y="155" width="435" height="96" rx="12" fill="#1a403f" stroke="#6ed9cb"/>
<text x="389" y="194" font-size="20">Deterministic eligibility</text><text x="389" y="224" font-size="15" fill="#b2d9d5">Class floor · document ACL · current model · region</text>
<rect x="874" y="155" width="282" height="96" rx="12" fill="#183546" stroke="#5bb9ae"/>
<text x="896" y="194" font-size="20">Bounded inference</text><text x="896" y="224" font-size="15" fill="#b2ceda">Reserve · route · validate · evidence</text>
<g stroke="#6ed9cb" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M294 202H349"/><path d="M800 202H858"/><path d="M581 251V306"/></g>
<rect x="365" y="322" width="435" height="110" rx="12" fill="#1b2b3a" stroke="#d7ab65"/>
<text x="389" y="363" font-size="20">Separate action authority</text><text x="389" y="393" font-size="15" fill="#d8c5a7">Exact arguments · two reviewers · single-use grant</text>
<rect x="874" y="322" width="282" height="110" rx="12" fill="#1b2b3a" stroke="#d7ab65"/>
<text x="896" y="363" font-size="20">Synthetic tool only</text><text x="896" y="393" font-size="15" fill="#d8c5a7">Owned asset · atomic action audit</text>
<path d="M800 376H858" stroke="#d7ab65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="44" y="493" font-size="17" fill="#b2ceda">v0.1.0: loopback fixtures · local SQLite · inspectable negative cases</text>
<text x="44" y="526" font-size="15" fill="#87acbd">Enterprise identity, real providers, learned-model quality and large-scale HA remain explicit gates.</text>
</g></svg>