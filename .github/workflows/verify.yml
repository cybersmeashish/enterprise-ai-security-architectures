name: Verify Enterprise AI Gateway

on:
  push:
    branches: [main]
    paths:
      - 'aiegateway/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'requirements.lock'
      - 'Dockerfile'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'aiegateway/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'requirements.lock'
      - 'Dockerfile'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-locked dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.lock
      - name: Validate governance records and run security suite
        run: |
          python -m tools.validate_governance examples/governance-pack.json
          python -m unittest discover -s tests -v
      - name: Prepare pinned image with build networking disabled
        run: |
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          python -m tools.prepare_wheels --architecture amd64
          docker build --network=none --pull=false -t ashish-enterprise-ai-gateway:0.1.0 .
      - name: Verify isolated gateway and measured HTTP cohorts
        run: python -m tools.run_isolated --output evidence/ci/gateway-report.json
      - name: Retain measured product evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: enterprise-ai-gateway-evidence
          path: evidence/ci/*
          retention-days: 14
