name: Bounded enterprise AI pilot
description: Propose an integration, research question or enterprise architecture pilot.
title: "[Pilot] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Business outcome and accountable owner role
      description: Describe the useful task, affected people and success measure.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Security and governance boundary
      description: List classification, location, identities, model/tool authority and required evidence. Use non-sensitive details.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Bounded pilot and acceptance gate
      description: Specify one use case, provider/identity integration, expected denied cases and current uncertainty.
    validations:
      required: true
